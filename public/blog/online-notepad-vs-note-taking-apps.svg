<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow12" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg12)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="880" cy="280" r="180" fill="#f97316" opacity="0.15" filter="url(#glow12)"/>
  <circle cx="320" cy="380" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow12)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 75)">
    <rect width="180" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="90" y="21" text-anchor="middle" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">TOOL SELECTION</text>
  </g>

  <!-- Left Header -->
  <text x="80" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Online Notepad vs
  </text>
  <text x="80" y="225" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Full Note Apps
  </text>
  <text x="80" y="275" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    When to use a lightning-fast browser notepad
  </text>
  <text x="80" y="302" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    versus a heavy long-term workspace system.
  </text>

  <g transform="translate(80, 360)">
    <rect width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="65" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">⚡ Fast Handoff</text>

    <rect x="145" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="210" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">📂 Long Archive</text>

    <rect x="290" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="355" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🎯 Right Fit</text>
  </g>

  <!-- Right Visual: Side-by-Side Architectural Decision Matrix -->
  <g transform="translate(560, 95)">
    <!-- Column 1: Online Notepad (Woff) -->
    <g transform="translate(0, 0)">
      <rect width="265" height="440" rx="16" fill="#18181b" stroke="#f97316" stroke-width="2"/>
      <rect width="265" height="48" rx="16" fill="#27272a"/>
      <text x="132" y="30" text-anchor="middle" fill="#f97316" font-family="system-ui, sans-serif" font-weight="800" font-size="14">ONLINE NOTEPAD</text>
      
      <g transform="translate(20, 70)">
        <text x="0" y="20" fill="#22c55e" font-family="system-ui, sans-serif" font-weight="700" font-size="13">✓ 0s Time to write</text>
        <text x="0" y="48" fill="#22c55e" font-family="system-ui, sans-serif" font-weight="700" font-size="13">✓ No login required</text>
        <text x="0" y="76" fill="#22c55e" font-family="system-ui, sans-serif" font-weight="700" font-size="13">✓ 1-Click share link</text>
        <text x="0" y="104" fill="#22c55e" font-family="system-ui, sans-serif" font-weight="700" font-size="13">✓ Lightweight &amp; fast</text>
        
        <rect y="130" width="225" height="1" fill="#3f3f46"/>
        
        <text x="0" y="160" fill="#f97316" font-family="system-ui, sans-serif" font-weight="700" font-size="12">BEST USED FOR:</text>
        <text x="0" y="185" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="13">• Quick handoffs</text>
        <text x="0" y="210" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="13">• Meeting recaps</text>
        <text x="0" y="235" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="13">• Cross-device transfers</text>
        <text x="0" y="260" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="13">• Temporary snippets</text>
      </g>
    </g>

    <!-- Column 2: Full Note Apps -->
    <g transform="translate(285, 0)">
      <rect width="265" height="440" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <rect width="265" height="48" rx="16" fill="#1e293b"/>
      <text x="132" y="30" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="800" font-size="14">FULL NOTE APPS</text>
      
      <g transform="translate(20, 70)">
        <text x="0" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="13">✓ Deep nested folders</text>
        <text x="0" y="48" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="13">✓ Complex databases</text>
        <text x="0" y="76" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="13">✓ Team permissions</text>
        <text x="0" y="104" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="13">✓ Permanent archive</text>
        
        <rect y="130" width="225" height="1" fill="#334155"/>
        
        <text x="0" y="160" fill="#64748b" font-family="system-ui, sans-serif" font-weight="700" font-size="12">BEST USED FOR:</text>
        <text x="0" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Company wikis</text>
        <text x="0" y="210" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Year-long projects</text>
        <text x="0" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Formal documentation</text>
        <text x="0" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Audit records</text>
      </g>
    </g>
  </g>
</svg>
