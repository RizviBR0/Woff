<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg4)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="850" cy="280" r="180" fill="#6366f1" opacity="0.18" filter="url(#glow4)"/>
  <circle cx="280" cy="380" r="150" fill="#f97316" opacity="0.12" filter="url(#glow4)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 75)">
    <rect width="175" height="32" rx="16" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.5"/>
    <text x="87" y="21" text-anchor="middle" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">DEV WORKFLOWS</text>
  </g>

  <!-- Left Header -->
  <text x="80" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    How to Share Code
  </text>
  <text x="80" y="225" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Snippets Online
  </text>
  <text x="80" y="275" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    No repository setup. Instant syntax highlighting,
  </text>
  <text x="80" y="302" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    error logs, and shareable snippet links.
  </text>

  <!-- Left Language Tags -->
  <g transform="translate(80, 360)">
    <rect width="100" height="36" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="50" y="23" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">TS / JS</text>

    <rect x="115" width="100" height="36" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="165" y="23" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="13" font-weight="bold">Python</text>

    <rect x="230" width="100" height="36" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="280" y="23" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="13" font-weight="bold">Rust</text>

    <rect x="345" width="90" height="36" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="390" y="23" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="13" font-weight="bold">JSON</text>
  </g>

  <!-- Right Visual: Code Window with Syntax Highlighting -->
  <g transform="translate(540, 95)">
    <rect width="580" height="440" rx="18" fill="#030712" stroke="#1f2937" stroke-width="1.5"/>
    
    <!-- Code Editor Title Bar -->
    <rect width="580" height="48" rx="18" fill="#111827"/>
    <circle cx="25" cy="24" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="42" cy="24" r="5" fill="#eab308" opacity="0.8"/>
    <circle cx="59" cy="24" r="5" fill="#22c55e" opacity="0.8"/>
    
    <rect x="100" y="10" width="150" height="28" rx="6" fill="#1f2937"/>
    <text x="175" y="28" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="12">shareApi.ts</text>

    <g transform="translate(460, 10)">
      <rect width="105" height="28" rx="6" fill="#f97316"/>
      <text x="52" y="19" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Copy Link ↗</text>
    </g>

    <!-- Code Editor Lines -->
    <g transform="translate(25, 75)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
      <!-- Line 1 -->
      <text x="0" y="18" fill="#4b5563">01</text>
      <text x="40" y="18" fill="#c084fc">import</text>
      <text x="95" y="18" fill="#e5e7eb">{ createSnippet }</text>
      <text x="245" y="18" fill="#c084fc">from</text>
      <text x="285" y="18" fill="#34d399">"@/woff/share"</text>
      <text x="405" y="18" fill="#e5e7eb">;</text>

      <!-- Line 2 -->
      <text x="0" y="44" fill="#4b5563">02</text>
      
      <!-- Line 3 -->
      <text x="0" y="70" fill="#4b5563">03</text>
      <text x="40" y="70" fill="#60a5fa">export async function</text>
      <text x="220" y="70" fill="#facc15">shareQuickSnippet</text>
      <text x="360" y="70" fill="#e5e7eb">(code) {</text>

      <!-- Line 4 -->
      <text x="0" y="96" fill="#4b5563">04</text>
      <text x="60" y="96" fill="#c084fc">const</text>
      <text x="110" y="96" fill="#e5e7eb">space =</text>
      <text x="180" y="96" fill="#c084fc">await</text>
      <text x="230" y="96" fill="#60a5fa">createSnippet</text>
      <text x="340" y="96" fill="#e5e7eb">({</text>

      <!-- Line 5 -->
      <text x="0" y="122" fill="#4b5563">05</text>
      <text x="80" y="122" fill="#93c5fd">syntax:</text>
      <text x="150" y="122" fill="#34d399">"typescript"</text>
      <text x="250" y="122" fill="#e5e7eb">,</text>

      <!-- Line 6 -->
      <text x="0" y="148" fill="#4b5563">06</text>
      <text x="80" y="148" fill="#93c5fd">authRequired:</text>
      <text x="200" y="148" fill="#f87171">false</text>
      <text x="245" y="122" fill="#e5e7eb">,</text>

      <!-- Line 7 -->
      <text x="0" y="174" fill="#4b5563">07</text>
      <text x="80" y="174" fill="#93c5fd">expiresIn:</text>
      <text x="170" y="174" fill="#34d399">"24h"</text>

      <!-- Line 8 -->
      <text x="0" y="200" fill="#4b5563">08</text>
      <text x="60" y="200" fill="#e5e7eb">});</text>

      <!-- Line 9 -->
      <text x="0" y="226" fill="#4b5563">09</text>
      <text x="60" y="226" fill="#c084fc">return</text>
      <text x="115" y="226" fill="#e5e7eb">space.shareUrl;</text>

      <!-- Line 10 -->
      <text x="0" y="252" fill="#4b5563">10</text>
      <text x="40" y="252" fill="#e5e7eb">}</text>
    </g>

    <!-- Bottom Notification pill -->
    <g transform="translate(25, 365)">
      <rect width="530" height="50" rx="10" fill="#111827" stroke="#374151"/>
      <circle cx="25" cy="25" r="5" fill="#22c55e"/>
      <text x="42" y="30" fill="#9ca3af" font-family="monospace" font-size="12">Live Share: <tspan fill="#38bdf8">https://woff.space/c/snippet-91</tspan> (Ready)</text>
    </g>
  </g>
</svg>
