<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg17" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow17" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg17)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="850" cy="280" r="180" fill="#f97316" opacity="0.15" filter="url(#glow17)"/>
  <circle cx="280" cy="380" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow17)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 75)">
    <rect width="180" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="90" y="21" text-anchor="middle" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">PRODUCT ARCHITECTURE</text>
  </g>

  <!-- Left Header -->
  <text x="80" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Why Woff Uses
  </text>
  <text x="80" y="225" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Temporary Spaces
  </text>
  <text x="80" y="275" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    Short-lived, disposable rooms eliminate workspace
  </text>
  <text x="80" y="302" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    clutter while keeping quick handoffs secure.
  </text>

  <g transform="translate(80, 360)">
    <rect width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="65" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">⏳ Ephemeral</text>

    <rect x="145" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="210" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🛡️ Auto-Purge</text>

    <rect x="290" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="355" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">✨ Zero Clutter</text>
  </g>

  <!-- Right Visual: Lifecycle Diagram of Temporary Space -->
  <g transform="translate(560, 95)">
    <rect width="560" height="440" rx="18" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    
    <!-- Top Header -->
    <rect width="560" height="50" rx="18" fill="#18181b"/>
    <text x="30" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="15">🔄 Disposable Room Lifecycle</text>
    
    <g transform="translate(30, 75)">
      <!-- Stage 1: Create -->
      <g transform="translate(0, 0)">
        <rect width="500" height="75" rx="12" fill="#18181b" stroke="#22c55e" stroke-width="1.5"/>
        <circle cx="28" cy="37" r="14" fill="#22c55e"/>
        <text x="28" y="42" text-anchor="middle" fill="#09090b" font-family="system-ui, sans-serif" font-weight="800" font-size="12">1</text>
        <text x="56" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="15">Instant Generation (0s)</text>
        <text x="56" y="52" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Room spins up on demand with a 4-digit code. Zero account required.</text>
      </g>

      <!-- Stage 2: Collaborate -->
      <g transform="translate(0, 90)">
        <rect width="500" height="75" rx="12" fill="#18181b" stroke="#f97316" stroke-width="1.5"/>
        <circle cx="28" cy="37" r="14" fill="#f97316"/>
        <text x="28" y="42" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12">2</text>
        <text x="56" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="15">Active Handoff Window</text>
        <text x="56" y="52" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Real-time collaboration, notes, files, drawings, and downloads.</text>
      </g>

      <!-- Stage 3: Auto-Expire -->
      <g transform="translate(0, 180)">
        <rect width="500" height="75" rx="12" fill="#18181b" stroke="#38bdf8" stroke-width="1.5"/>
        <circle cx="28" cy="37" r="14" fill="#38bdf8"/>
        <text x="28" y="42" text-anchor="middle" fill="#09090b" font-family="system-ui, sans-serif" font-weight="800" font-size="12">3</text>
        <text x="56" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="15">Graceful Expiration</text>
        <text x="56" y="52" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Auto-purged after session. No lingering workspaces or stale clutter.</text>
      </g>
    </g>

    <text x="60" y="375" fill="#71717a" font-family="monospace" font-size="11">✓ Ephemeral by design • Maximum privacy &amp; zero overhead</text>
  </g>
</svg>
