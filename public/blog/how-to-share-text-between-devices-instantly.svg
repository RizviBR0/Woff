<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="850" cy="300" r="180" fill="#f97316" opacity="0.15" filter="url(#glow3)"/>
  <circle cx="650" cy="400" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow3)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 75)">
    <rect width="180" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="90" y="21" text-anchor="middle" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">CROSS-DEVICE GUIDE</text>
  </g>

  <!-- Left Text -->
  <text x="80" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Share Text Between
  </text>
  <text x="80" y="225" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Devices Instantly
  </text>
  <text x="80" y="275" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    Move notes, links, and snippets between
  </text>
  <text x="80" y="302" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    phone, laptop, and tablet in real time.
  </text>

  <g transform="translate(80, 360)">
    <rect width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="65" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">📱 Mobile</text>

    <rect x="145" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="210" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">💻 Laptop</text>

    <rect x="290" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="355" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">📟 Tablet</text>
  </g>

  <!-- Right Visual: Interconnected Devices Diagram -->
  <g transform="translate(540, 100)">
    
    <!-- Sync Beam Curves -->
    <path d="M 120 310 Q 280 180 380 200" stroke="url(#beamGrad)" stroke-width="3" stroke-dasharray="6 4" fill="none" opacity="0.8"/>
    <path d="M 120 310 Q 240 380 430 380" stroke="url(#beamGrad)" stroke-width="3" stroke-dasharray="6 4" fill="none" opacity="0.8"/>

    <!-- Central Sync Pulse Icon -->
    <g transform="translate(250, 260)">
      <circle cx="24" cy="24" r="28" fill="#18181b" stroke="#f97316" stroke-width="2"/>
      <path d="M16 20l8-8 8 8M32 28l-8 8-8-8" stroke="#f97316" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 1. Mobile Phone (Left) -->
    <g transform="translate(40, 200)">
      <rect width="130" height="230" rx="20" fill="#09090b" stroke="#3f3f46" stroke-width="2"/>
      <!-- Screen Notch & Speaker -->
      <rect x="45" y="10" width="40" height="6" rx="3" fill="#27272a"/>
      <!-- Phone Content -->
      <rect x="15" y="32" width="100" height="175" rx="10" fill="#18181b"/>
      <rect x="25" y="48" width="70" height="8" rx="4" fill="#f97316"/>
      <rect x="25" y="66" width="80" height="6" rx="3" fill="#3f3f46"/>
      <rect x="25" y="78" width="60" height="6" rx="3" fill="#3f3f46"/>
      <rect x="25" y="100" width="80" height="40" rx="6" fill="#27272a"/>
      <text x="32" y="125" fill="#38bdf8" font-family="monospace" font-size="9">woff.space/8492</text>
    </g>

    <!-- 2. Laptop (Top Right) -->
    <g transform="translate(310, 80)">
      <!-- Screen -->
      <rect width="250" height="160" rx="10" fill="#09090b" stroke="#3f3f46" stroke-width="2"/>
      <!-- Screen Display -->
      <rect x="12" y="12" width="226" height="136" rx="6" fill="#18181b"/>
      <rect x="24" y="24" width="80" height="8" rx="4" fill="#f97316"/>
      <rect x="24" y="40" width="180" height="6" rx="3" fill="#3f3f46"/>
      <rect x="24" y="52" width="150" height="6" rx="3" fill="#3f3f46"/>
      <rect x="24" y="64" width="120" height="6" rx="3" fill="#3f3f46"/>
      <rect x="24" y="86" width="180" height="42" rx="6" fill="#27272a"/>
      <text x="36" y="112" fill="#22c55e" font-family="monospace" font-size="11">✓ Synced in 0.2s</text>
      <!-- Base/Keyboard -->
      <path d="M -20 160 L 270 160 L 250 176 L 0 176 Z" fill="#27272a" stroke="#3f3f46"/>
    </g>

    <!-- 3. Tablet (Bottom Right) -->
    <g transform="translate(350, 290)">
      <rect width="200" height="145" rx="14" fill="#09090b" stroke="#3f3f46" stroke-width="2"/>
      <rect x="10" y="10" width="180" height="125" rx="8" fill="#18181b"/>
      <circle cx="25" cy="25" r="4" fill="#38bdf8"/>
      <text x="36" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Tablet Notepad</text>
      <rect x="20" y="42" width="160" height="6" rx="3" fill="#3f3f46"/>
      <rect x="20" y="54" width="140" height="6" rx="3" fill="#3f3f46"/>
      <rect x="20" y="66" width="110" height="6" rx="3" fill="#3f3f46"/>
      <rect x="20" y="86" width="160" height="34" rx="6" fill="#27272a"/>
      <text x="30" y="108" fill="#fb923c" font-family="monospace" font-size="10">Shared Note Live</text>
    </g>

  </g>
</svg>
