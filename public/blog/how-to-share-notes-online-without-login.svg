<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glowing background orb -->
  <circle cx="850" cy="280" r="180" fill="#ea580c" opacity="0.18" filter="url(#glow)"/>
  <circle cx="280" cy="380" r="140" fill="#f97316" opacity="0.12" filter="url(#glow)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 75)">
    <rect width="180" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="90" y="21" text-anchor="middle" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">ZERO SIGNUP GUIDE</text>
  </g>

  <!-- Title & Description on Left -->
  <text x="80" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="46" letter-spacing="-1">
    How to Share Notes
  </text>
  <text x="80" y="225" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="46" letter-spacing="-1">
    Without Login
  </text>
  <text x="80" y="275" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18" width="400">
    Create a fast note, get a short link or code,
  </text>
  <text x="80" y="302" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    and share instantly with zero friction.
  </text>

  <!-- Left Pills / Feature Highlights -->
  <g transform="translate(80, 360)">
    <rect width="135" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <circle cx="20" cy="18" r="4" fill="#22c55e"/>
    <text x="34" y="23" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">No Account</text>

    <rect x="150" width="145" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <circle cx="170" cy="18" r="4" fill="#f97316"/>
    <text x="184" y="23" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Instant Link</text>

    <rect x="310" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <circle cx="330" cy="18" r="4" fill="#38bdf8"/>
    <text x="344" y="23" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Secure PIN</text>
  </g>

  <!-- Right Visual: Note Card & Share Modal Mockup -->
  <g transform="translate(560, 110)">
    <!-- Base Note Card -->
    <rect width="560" height="420" rx="20" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <rect width="560" height="46" rx="20" fill="#18181b" fill-opacity="0.8"/>
    <circle cx="25" cy="23" r="5.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="42" cy="23" r="5.5" fill="#eab308" opacity="0.8"/>
    <circle cx="59" cy="23" r="5.5" fill="#22c55e" opacity="0.8"/>
    <text x="280" y="28" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="12">woff.space/quick-note</text>

    <!-- Note Content Mock -->
    <g transform="translate(32, 70)">
      <text x="0" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="20">Meeting Recap &amp; Next Actions</text>
      <rect y="42" width="220" height="8" rx="4" fill="#3f3f46"/>
      <rect y="58" width="380" height="8" rx="4" fill="#27272a"/>
      <rect y="74" width="320" height="8" rx="4" fill="#27272a"/>
      <rect y="90" width="260" height="8" rx="4" fill="#27272a"/>
    </g>

    <!-- Floating Share Modal -->
    <g transform="translate(45, 200)">
      <rect width="470" height="180" rx="14" fill="#18181b" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.7"/>
      
      <!-- Modal Header -->
      <g transform="translate(24, 28)">
        <circle cx="12" cy="12" r="12" fill="#f97316" fill-opacity="0.2"/>
        <path d="M8 12l3 3 6-6" stroke="#f97316" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="34" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Your Shareable Link is Ready</text>
      </g>

      <!-- URL Input Box & Copy Button -->
      <g transform="translate(24, 68)">
        <rect width="320" height="42" rx="8" fill="#09090b" stroke="#3f3f46"/>
        <text x="14" y="26" fill="#a1a1aa" font-family="monospace" font-size="13">https://woff.space/n/8492</text>
        
        <rect x="330" width="90" height="42" rx="8" fill="url(#orangeGlow)"/>
        <text x="375" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="13">Copy</text>
      </g>

      <!-- Bottom metadata -->
      <text x="24" y="145" fill="#71717a" font-family="monospace" font-size="11">⚡ Instant access • No login • Auto-destruct optional</text>
    </g>
  </g>
</svg>
