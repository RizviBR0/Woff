    <!-- Checklist Items -->
    <g transform="translate(30, 75)">
      <!-- Item 1 (Done) -->
      <g transform="translate(0, 0)">
        <rect width="500" height="48" rx="8" fill="#064e3b"/>
        <circle cx="24" cy="24" r="10" fill="#22c55e"/>
        <path d="M19 24l3 3 7-7" stroke="#052e16" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="48" y="29" fill="#86efac" font-family="system-ui, sans-serif" font-size="14" text-decoration="line-through">2 Cartons Organic Oat Milk</text>
        <text x="420" y="29" fill="#4ade80" font-family="monospace" font-size="11">✓ In Cart</text>
      </g>

      <!-- Item 2 (Done) -->
      <g transform="translate(0, 56)">
        <rect width="500" height="48" rx="8" fill="#064e3b"/>
        <circle cx="24" cy="24" r="10" fill="#22c55e"/>
        <path d="M19 24l3 3 7-7" stroke="#052e16" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="48" y="29" fill="#86efac" font-family="system-ui, sans-serif" font-size="14" text-decoration="line-through">Honeycrisp Apples (Bag of 6)</text>
        <text x="420" y="29" fill="#4ade80" font-family="monospace" font-size="11">✓ In Cart</text>
      </g>

      <!-- Item 3 (Pending) -->
      <g transform="translate(0, 112)">
        <rect width="500" height="48" rx="8" fill="#022c22" stroke="#166534"/>
        <circle cx="24" cy="24" r="10" fill="none" stroke="#4ade80" stroke-width="2"/>
        <text x="48" y="29" fill="#f0fdf4" font-family="system-ui, sans-serif" font-size="14">Whole Bean Dark Roast Coffee</text>
        <text x="410" y="29" fill="#fbbf24" font-family="monospace" font-size="11">Aisle 4</text>
      </g>

      <!-- Item 4 (Pending) -->
      <g transform="translate(0, 168)">
        <rect width="500" height="48" rx="8" fill="#022c22" stroke="#166534"/>
        <circle cx="24" cy="24" r="10" fill="none" stroke="#4ade80" stroke-width="2"/>
        <text x="48" y="29" fill="#f0fdf4" font-family="system-ui, sans-serif" font-size="14">Avocado Oil &amp; Sourdough Bread</text>
        <text x="410" y="29" fill="#fbbf24" font-family="monospace" font-size="11">Bakery</text>
      </g>

      <!-- Bottom link bar -->
      <g transform="translate(0, 240)">
        <rect width="500" height="42" rx="8" fill="#22c55e"/>
        <text x="250" y="26" text-anchor="middle" fill="#052e16" font-family="system-ui, sans-serif" font-weight="700" font-size="13">🔗 woff.space/family-groceries • 2 of 4 checked</text>
      </g>
