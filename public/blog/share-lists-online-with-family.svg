<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#141c14"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <filter id="glow10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg10)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="850" cy="280" r="180" fill="#22c55e" opacity="0.15" filter="url(#glow10)"/>
  <circle cx="280" cy="380" r="140" fill="#f97316" opacity="0.12" filter="url(#glow10)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 75)">
    <rect width="165" height="32" rx="16" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.4"/>
    <text x="82" y="21" text-anchor="middle" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">FAMILY &amp; HOME</text>
  </g>

  <!-- Left Header -->
  <text x="80" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Share To-Do &amp; Grocery
  </text>
  <text x="80" y="225" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Lists With Family
  </text>
  <text x="80" y="275" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    Keep groceries, weekend chores, and travel lists
  </text>
  <text x="80" y="302" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    in sync with one simple link everyone can open.
  </text>

  <g transform="translate(80, 360)">
    <rect width="130" height="36" rx="8" fill="#14532d" stroke="#166534"/>
    <text x="65" y="23" text-anchor="middle" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🛒 Grocery List</text>

    <rect x="145" width="130" height="36" rx="8" fill="#14532d" stroke="#166534"/>
    <text x="210" y="23" text-anchor="middle" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🏡 Home Chores</text>

    <rect x="290" width="130" height="36" rx="8" fill="#14532d" stroke="#166534"/>
    <text x="355" y="23" text-anchor="middle" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">📱 Tap in Store</text>
  </g>

  <!-- Right Visual: Shared Checklist Mockup -->
  <g transform="translate(560, 95)">
