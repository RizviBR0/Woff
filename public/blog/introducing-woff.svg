<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#271c14"/>
    </linearGradient>
    <linearGradient id="orangeHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow14" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg14)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="850" cy="280" r="200" fill="#f97316" opacity="0.18" filter="url(#glow14)"/>
  <circle cx="280" cy="380" r="140" fill="#ea580c" opacity="0.12" filter="url(#glow14)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 75)">
    <rect width="165" height="32" rx="16" fill="url(#orangeHero)"/>
    <text x="82" y="21" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" letter-spacing="1.5">PRODUCT LAUNCH</text>
  </g>

  <!-- Left Header -->
  <text x="80" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="46" letter-spacing="-1">
    Introducing Woff
  </text>
  <text x="80" y="225" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="46" letter-spacing="-1">
    Simple Shareable Spaces
  </text>
  <text x="80" y="275" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    Create a space in 1 click. Share notes, images,
  </text>
  <text x="80" y="302" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    drawings, and files in real-time without friction.
  </text>

  <g transform="translate(80, 360)">
    <rect width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="65" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🚀 Fast Spaces</text>

    <rect x="145" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="210" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">👥 Live Sync</text>

    <rect x="290" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="355" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🔒 Passcode</text>
  </g>

  <!-- Right Visual: Woff Space Room Showcase Mockup -->
  <g transform="translate(560, 95)">
    <rect width="560" height="440" rx="18" fill="#09090b" stroke="#f97316" stroke-width="2"/>
    
    <!-- Top Space Header -->
    <rect width="560" height="52" rx="18" fill="#18181b"/>
    <circle cx="25" cy="26" r="4.5" fill="#ef4444"/>
    <circle cx="39" cy="26" r="4.5" fill="#eab308"/>
    <circle cx="53" cy="26" r="4.5" fill="#22c55e"/>

    <!-- 4-digit Room Code Badge -->
    <g transform="translate(200, 11)">
      <rect width="160" height="30" rx="8" fill="#27272a" stroke="#3f3f46"/>
      <text x="80" y="20" text-anchor="middle" fill="#fb923c" font-family="monospace" font-weight="bold" font-size="13">Room: #8492</text>
    </g>

    <!-- Space Content Grid -->
    <g transform="translate(30, 75)">
      <!-- Left Card: Note -->
      <g transform="translate(0, 0)">
        <rect width="240" height="180" rx="12" fill="#18181b" stroke="#27272a"/>
        <text x="18" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="15">📝 Quick Note</text>
        <rect x="18" y="46" width="160" height="6" rx="3" fill="#3f3f46"/>
        <rect x="18" y="58" width="200" height="6" rx="3" fill="#27272a"/>
        <rect x="18" y="70" width="180" height="6" rx="3" fill="#27272a"/>
        <rect x="18" y="82" width="140" height="6" rx="3" fill="#27272a"/>
        <rect x="18" y="106" width="200" height="50" rx="8" fill="#27272a"/>
        <text x="28" y="136" fill="#f97316" font-family="monospace" font-size="11">✓ Edited just now</text>
      </g>

      <!-- Right Card: Image Handoff -->
      <g transform="translate(260, 0)">
        <rect width="240" height="180" rx="12" fill="#18181b" stroke="#27272a"/>
        <rect x="18" y="18" width="204" height="105" rx="8" fill="#27272a"/>
        <circle cx="70" cy="65" r="18" fill="#f97316" fill-opacity="0.3"/>
        <path d="M40 100 L90 60 L140 90 L180 70 L210 100" stroke="#f97316" stroke-width="2" fill="none"/>
        <text x="18" y="150" fill="#e4e4e7" font-family="system-ui, sans-serif" font-weight="600" font-size="13">design-review.png</text>
        <text x="18" y="168" fill="#71717a" font-family="monospace" font-size="10">2.4 MB • Instant preview</text>
      </g>

      <!-- Live Cursor 1 (Rizvi) -->
      <g transform="translate(180, 140)">
        <path d="M0 0L14 14L8 16L6 22Z" fill="#f97316"/>
        <rect x="14" y="14" width="50" height="20" rx="4" fill="#f97316"/>
        <text x="39" y="28" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">Rizvi</text>
      </g>

      <!-- Live Cursor 2 (Alex) -->
      <g transform="translate(380, 60)">
        <path d="M0 0L14 14L8 16L6 22Z" fill="#38bdf8"/>
        <rect x="14" y="14" width="45" height="20" rx="4" fill="#38bdf8"/>
        <text x="36" y="28" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">Alex</text>
      </g>

      <!-- Bottom Broadcast Link Bar -->
      <g transform="translate(0, 200)">
        <rect width="500" height="50" rx="10" fill="#18181b" stroke="#f97316"/>
        <circle cx="25" cy="25" r="6" fill="#22c55e"/>
        <text x="42" y="30" fill="#ffffff" font-family="monospace" font-size="13">https://woff.space/8492 <tspan fill="#71717a">(Tap to join)</tspan></text>
        <rect x="400" y="10" width="85" height="30" rx="6" fill="#f97316"/>
        <text x="442" y="29" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Share ↗</text>
      </g>
    </g>
  </g>
</svg>
