<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title">
  <title id="title">Keep a copy before a shared room expires</title>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09090b"/><stop offset="1" stop-color="#1c1917"/></linearGradient><radialGradient id="glow"><stop stop-color="#f97316" stop-opacity=".22"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient><pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/><ellipse cx="950" cy="330" rx="400" ry="310" fill="url(#glow)"/>
  <g font-family="system-ui, sans-serif"><rect x="70" y="65" width="220" height="34" rx="17" fill="#f97316" fill-opacity=".12" stroke="#f97316" stroke-opacity=".4"/><text x="180" y="87" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="700" letter-spacing="2">TEMPORARY SHARING</text><text x="70" y="210" fill="#fafafa" font-size="62" font-weight="800">Keep the</text><text x="70" y="285" fill="#fb923c" font-size="62" font-weight="800">important copy.</text><text x="74" y="345" fill="#a1a1aa" font-size="22">Check. Download. Export. Archive.</text>
  <g transform="translate(750 120)"><rect width="345" height="385" rx="24" fill="#18181b" stroke="#3f3f46"/><circle cx="172" cy="92" r="45" fill="#f97316" fill-opacity=".12" stroke="#fb923c" stroke-width="2"/><path d="M172 63v29l20 13" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/><text x="172" y="170" text-anchor="middle" fill="#fafafa" font-size="20" font-weight="700">Before the deadline</text><g fill="none" stroke="#fb923c" stroke-width="2"><path d="m31 212 6 6 11-12M31 262l6 6 11-12M31 312l6 6 11-12"/></g><g fill="#d4d4d8" font-size="16"><text x="64" y="217">Open downloaded files</text><text x="64" y="267">Export final instructions</text><text x="64" y="317">Save to your project archive</text></g><text x="172" y="358" text-anchor="middle" fill="#71717a" font-size="13">A room is a bridge, not a backup</text></g><text x="74" y="560" fill="#d4d4d8" font-size="18" font-weight="700" letter-spacing="2">WOFF FIELD NOTES</text></g>
</svg>
