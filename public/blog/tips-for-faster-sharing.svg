<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <filter id="glow15" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg15)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="850" cy="280" r="180" fill="#f97316" opacity="0.16" filter="url(#glow15)"/>
  <circle cx="280" cy="380" r="140" fill="#38bdf8" opacity="0.10" filter="url(#glow15)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 75)">
    <rect width="165" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="82" y="21" text-anchor="middle" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">POWER USER TIPS</text>
  </g>

  <!-- Left Header -->
  <text x="80" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    5 Pro Tips for Faster
  </text>
  <text x="80" y="225" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Sharing with Woff
  </text>
  <text x="80" y="275" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    Speed up links, photos, and rich notes with these
  </text>
  <text x="80" y="302" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    five built-in high efficiency workflows.
  </text>

  <g transform="translate(80, 360)">
    <rect width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="65" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">⚡ Instant Paste</text>

    <rect x="145" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="210" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">📱 QR Scanner</text>

    <rect x="290" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="355" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">✏️ Markup Pen</text>
  </g>

  <!-- Right Visual: 5 Feature Cards Matrix -->
  <g transform="translate(560, 95)">
    <rect width="560" height="440" rx="18" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="560" height="50" rx="18" fill="#18181b"/>
    <text x="30" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="15">🔥 Power Workflows Checklist</text>
    
    <!-- 5 Tips Cards Grid -->
    <g transform="translate(30, 75)">
      <!-- Tip 1 -->
      <g transform="translate(0, 0)">
        <rect width="240" height="70" rx="10" fill="#18181b" stroke="#f97316" stroke-width="1.5"/>
        <text x="18" y="28" fill="#f97316" font-family="system-ui, sans-serif" font-weight="800" font-size="13">01. DIRECT CLIPBOARD</text>
        <text x="18" y="50" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">Paste screenshots directly (Ctrl+V)</text>
      </g>

      <!-- Tip 2 -->
      <g transform="translate(260, 0)">
        <rect width="240" height="70" rx="10" fill="#18181b" stroke="#27272a"/>
        <text x="18" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="800" font-size="13">02. QR CODE SHARE</text>
        <text x="18" y="50" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">Instant camera scan to join</text>
      </g>

      <!-- Tip 3 -->
      <g transform="translate(0, 85)">
        <rect width="240" height="70" rx="10" fill="#18181b" stroke="#27272a"/>
        <text x="18" y="28" fill="#22c55e" font-family="system-ui, sans-serif" font-weight="800" font-size="13">03. IMAGE ANNOTATION</text>
        <text x="18" y="50" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">Draw arrows &amp; highlight bugs</text>
      </g>

      <!-- Tip 4 -->
      <g transform="translate(260, 85)">
        <rect width="240" height="70" rx="10" fill="#18181b" stroke="#27272a"/>
        <text x="18" y="28" fill="#eab308" font-family="system-ui, sans-serif" font-weight="800" font-size="13">04. PASSCODE ROOMS</text>
        <text x="18" y="50" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">4-digit PIN for private notes</text>
      </g>

      <!-- Tip 5 (Full Width) -->
      <g transform="translate(0, 170)">
        <rect width="500" height="70" rx="10" fill="#18181b" stroke="#27272a"/>
        <text x="18" y="28" fill="#a855f7" font-family="system-ui, sans-serif" font-weight="800" font-size="13">05. ONE-CLICK BATCH DOWNLOAD</text>
        <text x="18" y="50" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12">Export all uploaded files and images in a single ZIP bundle</text>
      </g>
    </g>

    <!-- Bottom summary link -->
    <rect y="390" width="560" height="50" rx="18" fill="#18181b"/>
    <text x="30" y="420" fill="#71717a" font-family="monospace" font-size="12">woff.space • Boost collaboration speed by 3x</text>
  </g>
</svg>
