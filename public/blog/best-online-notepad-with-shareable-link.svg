<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="920" cy="300" r="190" fill="#38bdf8" opacity="0.12" filter="url(#glow2)"/>
  <circle cx="300" cy="200" r="150" fill="#f97316" opacity="0.12" filter="url(#glow2)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 75)">
    <rect width="165" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="82" y="21" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">PRODUCTIVITY</text>
  </g>

  <!-- Left Header -->
  <text x="80" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Best Online Notepad
  </text>
  <text x="80" y="225" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    With Shareable Link
  </text>
  <text x="80" y="275" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    Write clean notes in seconds, click share,
  </text>
  <text x="80" y="302" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    and broadcast instantly to any browser.
  </text>

  <!-- Key Specs / Highlights -->
  <g transform="translate(80, 360)">
    <g transform="translate(0, 0)">
      <rect width="200" height="60" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="20" y="26" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">LINK SHARING</text>
      <text x="20" y="48" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">1-Click Live URL</text>
    </g>
    <g transform="translate(220, 0)">
      <rect width="200" height="60" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="20" y="26" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">FORMATTING</text>
      <text x="20" y="48" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Markdown + Rich</text>
    </g>
  </g>

  <!-- Right Visual: Browser Window with Notepad Editor -->
  <g transform="translate(560, 95)">
    <rect width="560" height="440" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Browser Top Bar -->
    <rect width="560" height="52" rx="18" fill="#1e293b"/>
    <circle cx="25" cy="26" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="42" cy="26" r="5" fill="#eab308" opacity="0.8"/>
    <circle cx="59" cy="26" r="5" fill="#22c55e" opacity="0.8"/>

    <!-- URL bar -->
    <rect x="90" y="11" width="370" height="30" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="105" y="31" fill="#38bdf8" font-family="monospace" font-size="12">🔒 woff.space/p/rapid-ideas</text>

    <!-- Editor Toolbar -->
    <g transform="translate(30, 72)">
      <rect width="28" height="24" rx="4" fill="#334155"/>
      <text x="14" y="17" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">B</text>
      <rect x="36" width="28" height="24" rx="4" fill="#334155"/>
      <text x="50" y="17" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-style="italic" font-size="12">I</text>
      <rect x="72" width="28" height="24" rx="4" fill="#334155"/>
      <text x="86" y="17" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12">H1</text>
      <rect x="108" width="28" height="24" rx="4" fill="#334155"/>
      <text x="122" y="17" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">&lt;/&gt;</text>
      
      <!-- Right Share Button -->
      <g transform="translate(390, -4)">
        <rect width="110" height="32" rx="8" fill="#f97316"/>
        <text x="55" y="20" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Share Note ↗</text>
      </g>
    </g>

    <!-- Editor Note Content -->
    <g transform="translate(30, 125)">
      <text x="0" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="22">Product Launch Checklist</text>
      
      <g transform="translate(0, 48)">
        <circle cx="8" cy="8" r="7" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e"/>
        <path d="M5 8l2 2 4-4" stroke="#22c55e" stroke-width="1.5" fill="none"/>
        <text x="26" y="12" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">Finalize landing page copy</text>
      </g>

      <g transform="translate(0, 80)">
        <circle cx="8" cy="8" r="7" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e"/>
        <path d="M5 8l2 2 4-4" stroke="#22c55e" stroke-width="1.5" fill="none"/>
        <text x="26" y="12" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">Test instant link generation</text>
      </g>

      <g transform="translate(0, 112)">
        <circle cx="8" cy="8" r="7" fill="#f97316" fill-opacity="0.2" stroke="#f97316"/>
        <text x="26" y="12" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">Share with beta testers</text>
      </g>

      <g transform="translate(0, 144)">
        <circle cx="8" cy="8" r="7" fill="#475569"/>
        <text x="26" y="12" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Monitor live room activity</text>
      </g>
    </g>

    <!-- Bottom Status Bar -->
    <rect y="390" width="560" height="50" rx="18" fill="#1e293b" fill-opacity="0.6"/>
    <text x="30" y="420" fill="#64748b" font-family="monospace" font-size="12">Saved 1s ago • 142 words • Public Link Active</text>
  </g>
</svg>
