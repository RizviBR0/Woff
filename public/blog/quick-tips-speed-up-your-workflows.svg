<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <filter id="glow18" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg18)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="850" cy="280" r="180" fill="#f97316" opacity="0.16" filter="url(#glow18)"/>
  <circle cx="280" cy="380" r="140" fill="#eab308" opacity="0.12" filter="url(#glow18)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 75)">
    <rect width="170" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="85" y="21" text-anchor="middle" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">SHORTCUTS &amp; SPEED</text>
  </g>

  <!-- Left Header -->
  <text x="80" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Quick Tips: Speed Up
  </text>
  <text x="80" y="225" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Your Workflows
  </text>
  <text x="80" y="275" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    Master keyboard gestures, drag &amp; drop uploads,
  </text>
  <text x="80" y="302" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    and instant room navigation in Woff.
  </text>

  <g transform="translate(80, 360)">
    <rect width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="65" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">⌨️ Hotkeys</text>

    <rect x="145" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="210" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🖱️ Drag &amp; Drop</text>

    <rect x="290" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="355" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">⚡ 1-Tap Copy</text>
  </g>

  <!-- Right Visual: Keyboard Shortcut Keycaps & Action Visual -->
  <g transform="translate(560, 95)">
    <rect width="560" height="440" rx="18" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="560" height="50" rx="18" fill="#18181b"/>
    <text x="30" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="15">⚡ Essential Keyboard Shortcuts</text>
    
    <!-- Shortcut Keycaps -->
    <g transform="translate(30, 75)">
      <!-- Keycap 1: Paste -->
      <g transform="translate(0, 0)">
        <rect width="500" height="75" rx="12" fill="#18181b" stroke="#27272a"/>
        <!-- Keycaps -->
        <rect x="20" y="16" width="55" height="42" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>
        <text x="47" y="42" text-anchor="middle" fill="#fff" font-family="monospace" font-weight="bold" font-size="16">⌘</text>
        <rect x="85" y="16" width="55" height="42" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>
        <text x="112" y="42" text-anchor="middle" fill="#f97316" font-family="monospace" font-weight="bold" font-size="16">V</text>
        <text x="160" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="15">Instant Media &amp; Text Paste</text>
        <text x="160" y="52" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Directly uploads image from clipboard without file dialog</text>
      </g>

      <!-- Keycap 2: Send -->
      <g transform="translate(0, 90)">
        <rect width="500" height="75" rx="12" fill="#18181b" stroke="#27272a"/>
        <rect x="20" y="16" width="55" height="42" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>
        <text x="47" y="42" text-anchor="middle" fill="#fff" font-family="monospace" font-weight="bold" font-size="16">⌘</text>
        <rect x="85" y="16" width="55" height="42" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>
        <text x="112" y="42" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="14">↵</text>
        <text x="160" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="15">Quick Send &amp; Publish</text>
        <text x="160" y="52" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Instantly sends note or active draft into room stream</text>
      </g>

      <!-- Drag & Drop Dropzone -->
      <g transform="translate(0, 180)">
        <rect width="500" height="85" rx="12" fill="#18181b" stroke="#f97316" stroke-dasharray="6 4"/>
        <text x="250" y="40" text-anchor="middle" fill="#f97316" font-family="system-ui, sans-serif" font-weight="700" font-size="15">📥 Drag &amp; Drop Anywhere</text>
        <text x="250" y="62" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Drop photos, videos, or PDFs directly onto browser window</text>
      </g>
    </g>
  </g>
</svg>
