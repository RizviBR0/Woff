<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="glow11" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg11)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="850" cy="280" r="180" fill="#f4f4f5" opacity="0.08" filter="url(#glow11)"/>
  <circle cx="280" cy="380" r="140" fill="#f97316" opacity="0.10" filter="url(#glow11)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 75)">
    <rect width="165" height="32" rx="16" fill="#27272a" stroke="#3f3f46"/>
    <text x="82" y="21" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">MINIMALISM</text>
  </g>

  <!-- Left Header -->
  <text x="80" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Minimalist Note-Taking
  </text>
  <text x="80" y="225" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Keep It Simple &amp; Clean
  </text>
  <text x="80" y="275" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    Capture thoughts without clutter. A clean framework
  </text>
  <text x="80" y="302" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    for instant recall and effortless focus.
  </text>

  <g transform="translate(80, 360)">
    <rect width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="65" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🌱 Zero Clutter</text>

    <rect x="145" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="210" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🎯 High Focus</text>

    <rect x="290" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="355" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">⚡ Fast Recall</text>
  </g>

  <!-- Right Visual: Pure Zen Writing Canvas Mockup -->
  <g transform="translate(560, 95)">
    <rect width="560" height="440" rx="18" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    
    <!-- Focus Bar -->
    <rect width="560" height="48" rx="18" fill="#09090b"/>
    <circle cx="25" cy="24" r="4" fill="#52525b"/>
    <circle cx="39" cy="24" r="4" fill="#52525b"/>
    <circle cx="53" cy="24" r="4" fill="#52525b"/>
    <text x="280" y="29" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Zen Mode Enabled</text>
    
    <!-- Clean Typography Workspace -->
    <g transform="translate(45, 80)">
      <text x="0" y="24" fill="#ffffff" font-family="Georgia, serif" font-weight="700" font-size="24">The 3-Step Note Rule</text>
      
      <!-- Principle 1 -->
      <g transform="translate(0, 50)">
        <text x="0" y="20" fill="#f97316" font-family="monospace" font-weight="bold" font-size="14">01. CAPTURE</text>
        <text x="0" y="42" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">Record the core idea immediately before context fades.</text>
      </g>

      <!-- Principle 2 -->
      <g transform="translate(0, 120)">
        <text x="0" y="20" fill="#f97316" font-family="monospace" font-weight="bold" font-size="14">02. CLARIFY</text>
        <text x="0" y="42" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">Identify if it requires action or is reference knowledge.</text>
      </g>

      <!-- Principle 3 -->
      <g transform="translate(0, 190)">
        <text x="0" y="20" fill="#f97316" font-family="monospace" font-weight="bold" font-size="14">03. HAND OFF</text>
        <text x="0" y="42" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">Share the link or archive into long-term storage.</text>
      </g>
    </g>

    <!-- Bottom Status -->
    <rect y="392" width="560" height="48" rx="18" fill="#09090b"/>
    <text x="45" y="422" fill="#71717a" font-family="monospace" font-size="12">Distraction-free canvas • 0 menus • Instant clarity</text>
  </g>
</svg>
