<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <filter id="glow8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg8)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="850" cy="280" r="180" fill="#a855f7" opacity="0.15" filter="url(#glow8)"/>
  <circle cx="280" cy="380" r="140" fill="#f43f5e" opacity="0.12" filter="url(#glow8)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 75)">
    <rect width="160" height="32" rx="16" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="80" y="21" text-anchor="middle" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">STUDY GUIDE</text>
  </g>

  <!-- Left Header -->
  <text x="80" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    How Students Share
  </text>
  <text x="80" y="225" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Notes Before Exams
  </text>
  <text x="80" y="275" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    Keep study group summaries in one clean space
  </text>
  <text x="80" y="302" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    instead of messy group chat screenshots.
  </text>

  <g transform="translate(80, 360)">
    <rect width="130" height="36" rx="8" fill="#1e1b4b" stroke="#3730a3"/>
    <text x="65" y="23" text-anchor="middle" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="500">📝 Study Sheets</text>

    <rect x="145" width="130" height="36" rx="8" fill="#1e1b4b" stroke="#3730a3"/>
    <text x="210" y="23" text-anchor="middle" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="500">👥 Group Sync</text>

    <rect x="290" width="130" height="36" rx="8" fill="#1e1b4b" stroke="#3730a3"/>
    <text x="355" y="23" text-anchor="middle" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="500">⚡ Live Edit</text>
  </g>

  <!-- Right Visual: Exam Study Deck Mockup -->
  <g transform="translate(560, 95)">
    <rect width="560" height="440" rx="18" fill="#0f0d1b" stroke="#2e1065" stroke-width="1.5"/>
    
    <!-- Top Deck Header -->
    <rect width="560" height="50" rx="18" fill="#1e1035"/>
    <text x="30" y="32" fill="#f43f5e" font-family="system-ui, sans-serif" font-weight="700" font-size="15">🔥 Bio Finals Revision • Study Group Alpha</text>
    
    <g transform="translate(425, 12)">
      <rect width="105" height="26" rx="6" fill="#f43f5e"/>
      <text x="52" y="17" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">Exam in 2d</text>
    </g>

    <!-- Study Content -->
    <g transform="translate(30, 75)">
      <!-- Topic 1 Card -->
      <g transform="translate(0, 0)">
        <rect width="500" height="85" rx="12" fill="#1c1033" stroke="#3b0764"/>
        <text x="20" y="26" fill="#a855f7" font-family="system-ui, sans-serif" font-weight="700" font-size="14">TOPIC 1: CELLULAR RESPIRATION</text>
        <text x="20" y="50" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">Glycolysis (Cytoplasm) → Krebs Cycle (Mitochondria) → ETC</text>
        <text x="20" y="70" fill="#38bdf8" font-family="monospace" font-size="11">⚡ Net yield: 36-38 ATP per glucose molecule</text>
      </g>

      <!-- Topic 2 Card -->
      <g transform="translate(0, 95)">
        <rect width="500" height="85" rx="12" fill="#1c1033" stroke="#3b0764"/>
        <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="14">TOPIC 2: DNA REPLICATION ENZYMES</text>
        <text x="20" y="50" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">Helicase (Unwinds) • Polymerase (Synthesizes) • Ligase (Glues)</text>
        <text x="20" y="70" fill="#facc15" font-family="monospace" font-size="11">★ High probability exam question on Okazaki fragments</text>
      </g>

      <!-- Active Group Avatars & Shared link -->
      <g transform="translate(0, 195)">
        <rect width="500" height="60" rx="10" fill="#1e1035" stroke="#4c1d95"/>
        
        <!-- Avatars -->
        <g transform="translate(20, 15)">
          <circle cx="15" cy="15" r="14" fill="#ec4899"/>
          <text x="15" y="19" text-anchor="middle" fill="#fff" font-size="11">S</text>
          <circle cx="38" cy="15" r="14" fill="#3b82f6"/>
          <text x="38" y="19" text-anchor="middle" fill="#fff" font-size="11">M</text>
          <circle cx="61" cy="15" r="14" fill="#10b981"/>
          <text x="61" y="19" text-anchor="middle" fill="#fff" font-size="11">J</text>
          <text x="90" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">3 friends revising now</text>
        </g>

        <!-- Link Button -->
        <g transform="translate(360, 12)">
          <rect width="120" height="36" rx="8" fill="#a855f7"/>
          <text x="60" y="23" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Join Room ↗</text>
        </g>
      </g>

      <text x="0" y="295" fill="#71717a" font-family="monospace" font-size="11">woff.space/bio-finals • Changes update live for all group members</text>
    </g>
  </g>
</svg>
