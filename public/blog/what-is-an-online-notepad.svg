<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <filter id="glow13" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg13)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="850" cy="280" r="180" fill="#f97316" opacity="0.15" filter="url(#glow13)"/>
  <circle cx="280" cy="380" r="140" fill="#fb923c" opacity="0.12" filter="url(#glow13)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 75)">
    <rect width="165" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="82" y="21" text-anchor="middle" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">EXPLAINER</text>
  </g>

  <!-- Left Header -->
  <text x="80" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    What Is an Online
  </text>
  <text x="80" y="225" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Notepad?
  </text>
  <text x="80" y="275" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    Learn why an in-browser scratchpad is faster than
  </text>
  <text x="80" y="302" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">
    heavy document editors and messy email chains.
  </text>

  <g transform="translate(80, 360)">
    <rect width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="65" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">⚡ In-Browser</text>

    <rect x="145" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="210" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🔗 Instant URL</text>

    <rect x="290" width="130" height="36" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="355" y="23" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🚫 0 Install</text>
  </g>

  <!-- Right Visual: Speed Race Comparison Graphic -->
  <g transform="translate(560, 95)">
    <rect width="560" height="440" rx="18" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="560" height="50" rx="18" fill="#18181b"/>
    <text x="30" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="15">⏱️ Time to Share Comparison</text>
    
    <!-- Speed Tracks -->
    <g transform="translate(30, 75)">
      <!-- Track 1: Online Notepad (Woff) -->
      <g transform="translate(0, 0)">
        <rect width="500" height="90" rx="12" fill="#18181b" stroke="#f97316" stroke-width="1.5"/>
        <text x="20" y="28" fill="#f97316" font-family="system-ui, sans-serif" font-weight="800" font-size="14">ONLINE NOTEPAD (WOFF)</text>
        <text x="430" y="28" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="15">~3 sec</text>
        
        <!-- Fast Progress Bar -->
        <rect x="20" y="44" width="460" height="12" rx="6" fill="#27272a"/>
        <rect x="20" y="44" width="460" height="12" rx="6" fill="#f97316"/>
        
        <text x="20" y="75" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Open site → Type note → Copy link (Instant)</text>
      </g>

      <!-- Track 2: Cloud Docs -->
      <g transform="translate(0, 105)">
        <rect width="500" height="90" rx="12" fill="#141416" stroke="#27272a"/>
        <text x="20" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="700" font-size="14">HEAVY CLOUD DOCS</text>
        <text x="415" y="28" fill="#ef4444" font-family="monospace" font-weight="bold" font-size="14">~90 sec</text>
        
        <!-- Slow Progress Bar -->
        <rect x="20" y="44" width="460" height="12" rx="6" fill="#27272a"/>
        <rect x="20" y="44" width="160" height="12" rx="6" fill="#64748b"/>
        
        <text x="20" y="75" fill="#71717a" font-family="system-ui, sans-serif" font-size="12">Login → Pick folder → Name doc → Set permissions → Send invite</text>
      </g>

      <!-- Track 3: Email Drafts -->
      <g transform="translate(0, 210)">
        <rect width="500" height="90" rx="12" fill="#141416" stroke="#27272a"/>
        <text x="20" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="700" font-size="14">EMAIL ATTACHMENTS</text>
        <text x="410" y="28" fill="#ef4444" font-family="monospace" font-weight="bold" font-size="14">~120 sec</text>
        
        <rect x="20" y="44" width="460" height="12" rx="6" fill="#27272a"/>
        <rect x="20" y="44" width="110" height="12" rx="6" fill="#64748b"/>
        
        <text x="20" y="75" fill="#71717a" font-family="system-ui, sans-serif" font-size="12">Compose → Find address → Save file → Attach → Deal with inbox noise</text>
      </g>
    </g>

    <!-- Bottom summary -->
    <text x="50" y="415" fill="#71717a" font-family="monospace" font-size="11">Result: 30x faster handoff for temporary communication</text>
  </g>
</svg>
